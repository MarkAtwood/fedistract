[package]
name = "fedi-provenance"
version = "0.1.0"
edition = "2021"
rust-version = "1.72"
license = "MIT OR Apache-2.0"
description = "Content provenance proofs for ActivityPub media attachments"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
fedi-did = { path = "../fedi-did" }
multibase = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
