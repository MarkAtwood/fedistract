[package]
name = "fieldwork"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Opinionated building blocks for fediverse servers in Rust"
repository = "https://github.com/MarkAtwood/fieldwork"
keywords = ["activitypub", "federation", "fediverse", "mastodon"]
categories = ["web-programming"]

[dependencies]
thiserror = "2"

# Feature-gated dependencies
ammonia = { version = "4", optional = true }
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
rand = { version = "0.8", optional = true }
regex = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tracing = { version = "0.1", optional = true }
whatlang = { version = "0.16", optional = true }

[features]
default = []
error = ["dep:axum", "dep:serde_json", "dep:tracing"]
auth = ["dep:argon2", "dep:sha2", "dep:rand"]
sanitize = ["dep:ammonia", "dep:pulldown-cmark"]
content = ["dep:regex", "dep:serde", "dep:serde_json", "dep:whatlang"]
theme = ["dep:serde_json", "dep:regex", "dep:tracing"]
full = ["error", "auth", "sanitize", "content", "theme"]
