[package]
name = "fedi-ucan"
version = "0.1.0"
edition = "2021"
rust-version = "1.72"
license = "MIT OR Apache-2.0"
description = "UCAN capability delegation tokens for ActivityPub actors"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
fedi-did = { path = "../fedi-did" }
multibase = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
