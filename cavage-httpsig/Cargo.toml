[package]
name = "cavage-httpsig"
version = "0.1.0"
edition = "2021"
rust-version = "1.72"
license = "MIT OR Apache-2.0"
description = "HTTP Signatures (draft-cavage-12) for ActivityPub federation"
repository = "https://github.com/MarkAtwood/cavage-httpsig"
keywords = ["http-signatures", "activitypub", "federation", "mastodon", "rsa"]
categories = ["authentication", "cryptography", "web-programming"]

[dependencies]
base64 = "0.22"
http = "1"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = { version = "0.10", features = ["oid"] }
thiserror = "2"
url = "2"

[dev-dependencies]
